# F022
# Printer_size: 260x260x300
# Version: v1.0.47
# CreateDate: 2025/01/17
# Nozzle_mcu: chip: GD32F303CBT6
#             version: F022-NOZZLE-V1.0.0
# Leveling_mcu: chip: GD32E230F8P6
#             version: F022-LEVELING-V1.0.0
# mcu: chip: GD32F303RET6
#      version: CR4CU220812S12

[include sensorless.cfg]
[include gcode_macro.cfg]
[include printer_params.cfg]
[include box.cfg]

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command
#reserved_move_slots_ratio: 0.20

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command
#reserved_move_slots_ratio: 0.20

[mcu bed_mcu]
serial: /dev/ttyS4
baud: 230400
restart_method: command

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0
hysteresis: 10
max_error: 240

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[mcu rpi]
serial:/tmp/klipper_host_mcu

[bl24c16f]
i2c_mcu: rpi
i2c_bus: i2c.3
i2c_speed: 400000

[idle_timeout]
timeout: 99999999

[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes

[gcode_arcs]
resolution: 1.0

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[io_remap]
src_pin: PB3    # 输入pin脚索引号(被映射)
remap_pin: PA15  # 输出pin脚索引号(映射)
src_pullup: 1    # 输入pin脚的上下拉配置,1表示上拉(意味着读取到0表示触发),0表示下拉(意味着读取到1表示触发)
remap_def: 1     # 输出pin脚的默认输出电平
filterNum: 1     # 当读取输入pin脚有效电平持续时间大于等于filterNum * periodTicks, 置输出pin脚为有效电平状态。如果输入的参数为0, 将采用默认值5
periodTicks: 0  # 轮询输入pin脚周期, 单位ticks。如果输入的参数为0, 采用50uS对应的tick默认值

[stepper_x]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA11
microsteps: 16 #32
rotation_distance: 39 #40
#endstop_pin: tmc2209_stepper_x:virtual_endstop
endstop_pin: PC7 #nozzle_mcu: PB3
# endstop_pin:!nozzle_mcu:PB0
position_endstop: 275
position_min: -16
position_max: 279  #比大 extrude_pos_x 1mm,避免超限
homing_speed: 60
homing_retract_dist: 5
second_homing_speed: 20

[tmc2209 stepper_x]
uart_pin:PA9
interpolate: True
run_current:0.8
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address:3
diag_pin: ^PA8
driver_TBL: 1
driver_TOFF: 2
driver_HEND: 2
driver_HSTRT: 4
driver_SGTHRS: 40

[stepper_y]
step_pin: PB8
dir_pin:  PB7
enable_pin: !PA11
microsteps: 16 #32
rotation_distance: 39 #40
#endstop_pin: tmc2209_stepper_y:virtual_endstop
endstop_pin: ^PB12
position_endstop:278 #-7
position_min: -7
position_max: 280 #283
homing_speed: 80
homing_retract_dist: 7
second_homing_speed: 20

[tmc2209 stepper_y]
uart_pin:PA10
interpolate: True
run_current: 1.2
hold_current:0.8
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address:3
diag_pin: ^PA6
driver_TBL: 1
driver_TOFF: 2
driver_HEND: 2
driver_HSTRT: 4
driver_SGTHRS: 65

[stepper_z]
step_pin:PB6
dir_pin: PB5
enable_pin: !PA11
microsteps: 32
rotation_distance:8.0 
endstop_pin:probe:z_virtual_endstop
position_max: 260
position_min: -5
homing_speed: 5
second_homing_speed:5
homing_retract_dist:5.0

[tmc2208 stepper_z]
uart_pin:PA4
# uart_address:3
interpolate: true
run_current:0.6
sense_resistor: 0.10
stealthchop_threshold: 0#0 非静音模式，9999 静音模式，打开静音模式后Z轴运动声音异常；

[prtouch_v3] # PC15:CLK, PC14:SDO
z_offset: 0
speed: 5
samples: 1
samples_result: median
samples_tolerance_retries: 5
samples_tolerance: 0.5
step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15        #triger status sync
# prth_msg_show: True
prth_dbg_ippt: 127.0.0.1
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14      #cs1237 transmit port clk->pb13 dio->pb14
pres_tri_hold:4000, 10000, 500
# prth_tmp_comp:26,300,0,0.80
# prth_tmp_comp:26,300,0,0.19
# prth_tmp_comp:26,300,0,0.20
# prth_tmp_comp:26,300,0,0.24
# prth_tmp_comp:26,300,0,0.17
# prth_tmp_comp:26,300,0,0.19
prth_tmp_comp:26,300,0,0.17
prth_max_chps:8
prth_min_fans:0.1
# prth_gas_calr:0.001
prth_err_diff:0.01
pres_chk_hold:5


[thermistor my_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 150
resistance2: 1296.7
temperature3: 250
resistance3: 192.73

[extruder]
max_extrude_cross_section: 80
max_extrude_only_distance:1000.0
max_extrude_only_velocity:30 # 单独E轴移动，回抽填充最大速度
step_pin:nozzle_mcu:PB5
dir_pin:!nozzle_mcu:PB4
enable_pin:!nozzle_mcu:PB2
microsteps:16 #32
rotation_distance:4.21
nozzle_diameter:0.400
filament_diameter:1.750
heater_pin:nozzle_mcu:PB8
sensor_type: my_thermistor
#sensor_type: EPCOS 100K B57560G104F
sensor_pin:nozzle_mcu:PA0#PC5
pressure_advance: 0.031
control:pid
pid_kp = 40.605
pid_ki = 13.535
pid_kd = 30.454
min_temp:0
max_temp:320 # 硬件安全限制
max_target_temp:300 # 新增：用户可配置的目标温度上限


[tmc2209 extruder]
uart_pin:nozzle_mcu:PB11
tx_pin:nozzle_mcu:PB10
interpolate: True
run_current:0.55  #MS35776
sense_resistor: 0.2
stealthchop_threshold: 0
uart_address:3


[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 20
pid_ki: 0.1
pid_kd: 0.06
min_temp: 0
max_temp: 120 # 硬件安全限制
max_target_temp: 100 # 新增：用户可配置的目标温度上限
temp_offset_flag:True
#adc_temp_list: 25,40,55,85,105,120
adc_temp_list:  25,40,55,80,100,110
actual_temp_list: 25,38,50,65,80,110
bed_power_type: AC

power_calibration_enable:0
power_calibration_detection_power:0.5
power_calibration_wait_even_heating_time:0 #预热时间 s
power_calibration_start_temp:70 # 开始校准目标温度
power_calibration_end_temp:90 # 结束校准目标温度
power_calibration_sample_interval:0.1 # 温度采样间隔 s
power_calibration_sample_end_temp_offset:15 # 校准结束采样温度偏移
power_calibration_sample_start_temp_offset:10 # 校准开始采样温度偏移
power_calibration_full_power_110_220_slop_divide:0.25 # 110V和220V的功率斜率分隔
power_calibration_power_220:0.75 # 220V配置功率
power_calibration_power_110:1 # 110V配置功率
power_calibration_max_calibrate_times:10 # 最大校准次数
power_calibration_retry_times:3 # 校准重试次数
power_calibration_heating_slope_low:0.45    # 斜率范围>low ℃/s
power_calibration_heating_slope_high:0.67   # 斜率范围<high ℃/s


#模型散热风扇
[output_pin fanp0]
pin: !nozzle_mcu: PB6
[output_pin fan0]
pin: !nozzle_mcu:PA11# PA11
pwm: True
#cycle_time: 0.00004
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
#scale: 100
shutdown_value: 0.0

#底板风扇A12
[output_pin board_fan]
pin: PA12

#E电机散热风扇A10
[output_pin e_fan]
pin:nozzle_mcu:PA10

[e_motor_fan]
check_interval: 2.0
shut_off_temp: 50.0

#喉管散热风扇
[heater_fan hotend_fan]
pin: !nozzle_mcu:PA9
enable_pin: nozzle_mcu:PB7
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 0.9
heater_temp: 50.0

[duplicate_pin_override]
pins: PA8,PA6,PB13,PA10,PB9,PB10,PB7,PB8,PB4,PA5,PB6,PB5,PA11


#共振补偿
[lis2dw x]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: -x,z,-y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[lis2dw y]
cs_pin: bed_mcu:PA4
spi_speed: 5000000
axes_map: -x,y,-z 
spi_software_sclk_pin: bed_mcu:PA5
spi_software_mosi_pin: bed_mcu:PA7
spi_software_miso_pin: bed_mcu:PA6

[resonance_tester]
accel_chip_x: lis2dw x
accel_chip_y: lis2dw y
max_freq: 90
accel_per_hz: 75
probe_points:
   130,130,60

#调平配置
[bed_mesh]
speed: 200
mesh_min: 5,5
mesh_max: 255,255
probe_count: 9,9
fade_start: 2.0
fade_end: 0.0 #50.0
algorithm: bicubic
horizontal_move_z: 3
split_delta_z: 0.01
move_check_distance: 1

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 10000
max_accel_to_decel: 10000
max_z_velocity: 20
square_corner_velocity: 12.0
square_corner_max_velocity: 200.0
max_z_accel: 100


[exclude_object]


[nozzle_clear]
clear_temp:170
enable_clear:true
start_pos: 108, 270
touch_cnt: 3
#clear_start: 23, 274  #安装胶条位置
clear_start: 6, 271
probe_pos_diff: 0, 0
clear_lenght: 27, 2
upraise: 2.1
clear_cnt: 6
bed_clean_y: 272
bed_clean_z: -0.8
clear_end_pos: 130, 130
clear_speed: 12000
return_length: 7.0


#Z轴电机线检测
[tmc_line_check]


[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !nozzle_mcu:PA1
runout_gcode:
  PAUSE_RUNOUT_GCODE


[timer_read]
interval: 0.1
print_interval: 0.1
extruder_interval: 1.0

# [filament_switch_sensor filament_sensor_2]
# pause_on_runout: false
# switch_pin: PB12
# [filament_switch_sensor filament_sensor_3]
# pause_on_runout: false
# switch_pin: PB13
# [filament_switch_sensor filament_sensor_4]
# pause_on_runout: false
