[gcode_macro APPLY_PENDING_SETTINGS]
description: Apply pending settings (Qmode and speed) that were set when not printing
gcode:
  # 1. Apply pending Qmode setting
  {% set qmode_obj = printer['gcode_macro Qmode'] %}
  {% if qmode_obj and qmode_obj.pending|int == 1 %}
    Qmode FORCE=1
    {action_respond_info("Pending applied: Qmode")}
  {% endif %}

  # 2. Apply pending speed setting
  {% set gcode_move = printer.gcode_move %}
  {% if gcode_move.speed_pending is not none %}
    {% set speed_pending = gcode_move.speed_pending %}
    M220 P2
    {action_respond_info("Pending applied: Speed S%d" % speed_pending)}
  {% endif %}



[gcode_macro END_PRINT_POINT]
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
  {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float + 1 %}
  {% set x_park = printer["gcode_macro PRINTER_PARAM"].extrude_position|float %}
  {% set y_park = printer["gcode_macro PRINTER_PARAM"].end_print_y_position|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z + 50 > max_z %}
    {% set pos_z = max_z %}
  {% else %}
    {% set pos_z = printer.toolhead.position.z|float + 50 %}
  {% endif %}
  G90
  G1 F800 Z{pos_z}
  ###########################
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  # complete 才进行退料
  {% set print_status = printer['print_stats'].state %}
  {% set skip_retract = 0 if print_status == "printing" else 1 %}
  {% if printer['box'].enable|int == 1 and printer['box'].state|lower == 'connect' %}
    CR_BOX_RETRUDE LENGTH=-{E}
    BOX_END SKIP_RETRUDE={skip_retract}
    BOX_END_PRINT
  {% elif printer['smart_filament_rack'].enable|int == 1 and printer['smart_filament_rack'].state|lower == 'connect' %}
    SMART_FILAMENT_RACK_END SKIP_RETRUDE={skip_retract}
    SMART_FILAMENT_RACK_END_PRINT
  {% else %}
    BOX_GO_TO_EXTRUDE_POS
    M104 S0
    M106 S200
    G4 P5000
    M400
    M106 S0
    BOX_NOZZLE_CLEAN
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      M83
      # 重新加热到保存的打印温度；修复低于挤出温度错误
      M109 S{printer['gcode_macro PRINTER_PARAM'].hotend_temp|int}
      G1 E-{E} F2000
      G90
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
  {% endif %}
  ###########################
  G1 F6000 X{x_park}
  G1 F6000 Y{y_park}
  # 保存抬升后的Z位置（M84关电机前的逻辑位置）
  {action_respond_info("END_PRINT: Saving Z position %.2f" % pos_z)}
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=saved_end_print_z VALUE={pos_z}
  {% else %}
    {action_respond_info("end print xyz_axes is NULL\n")}
  {% endif %}

[gcode_macro END_PRINT]
gcode:
  ENABLE_PRESSURE_ADVANCE VALUE=1
  {action_respond_info("CANCEL_PRINT trigger ENABLE_PRESSURE_ADVANCE=1")}
  Qmode_exit
  EXCLUDE_OBJECT_RESET
  PRINT_PREPARE_CLEAR
  END_PRINT_POINT
  TURN_OFF_HEATERS
  M107
  M84
  AUTO_COOLING_OPEN
  # 根据挤出机温度来关闭挤出电机的散热风扇 (extruder_temp < 50℃)
  E_MOTOR_FAN_CLOSE

# 启动功率监控
[gcode_macro START_POWER_MONITOR]
variable_max_power_ratio: 1.8
variable_check_interval: 1
variable_enavled: 0 # 0:关闭 1:开启
gcode:
  {% set enavled = printer["gcode_macro START_POWER_MONITOR"].enavled|int %}
  {% if enavled == 1 %}
    UPDATE_DELAYED_GCODE ID=POWER_MONITOR_LOOP DURATION=1
  {% endif %}
# 停止功率监控
[gcode_macro STOP_POWER_MONITOR]
gcode:
  BED_HEADER_SET_HEARER_POWER_SAVE S=1.0
  EXTRUDER_HEADER_SET_HEARER_POWER_SAVE S=1.0
  UPDATE_DELAYED_GCODE ID=POWER_MONITOR_LOOP DURATION=0
[delayed_gcode POWER_MONITOR_LOOP]
initial_duration: 0
gcode:
  {% set bed_power = printer.heater_bed.power|float %}
  {% set extruder_power = printer.extruder.power|float %}
  {% set total_power = bed_power + extruder_power %}
  {% set max_power = printer["gcode_macro START_POWER_MONITOR"].max_power_ratio|float %}
  {% set check_interval = printer["gcode_macro START_POWER_MONITOR"].check_interval|float %}
  {% set excess_ratio = total_power / max_power %}

  {% if total_power == 0 %}
    STOP_POWER_MONITOR
  {% else %}
    {% if (excess_ratio != 1.0) and (excess_ratio != 0.0)%}
      {% if excess_ratio < 1.0%}
        {% set excess_ratio = 1.0 %}
      {% endif %}
      # 喷嘴功率上限为1
      EXTRUDER_HEADER_SET_HEARER_POWER_SAVE S={1.0/excess_ratio}
      # 热床功率动态调控
      {% if extruder_power >= 0.7 %}
        BED_HEADER_SET_HEARER_POWER_SAVE S={0.8/excess_ratio}
      {% else %}
        BED_HEADER_SET_HEARER_POWER_SAVE S={1.0/excess_ratio}
      {% endif %}
    {% endif %}
    # 设置下一次检查
    UPDATE_DELAYED_GCODE ID=POWER_MONITOR_LOOP DURATION={check_interval}
  {% endif %}

[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  Rmode_exit
;  BOX_ERROR_CLEAR
  BOX_START_PRINT
  SMART_FILAMENT_START_PRINT
  {% set acc = printer["gcode_macro PRINTER_PARAM"].default_acc %}
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=saved_end_print_z VALUE=0
  G90
  SET_GCODE_OFFSET Z=0
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10
  M204 S{acc}
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=6000
  {% set g28_extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set bed_temp = printer.custom_macro.default_bed_temp %}
  {% set extruder_temp = printer.custom_macro.default_extruder_temp %}
  {% set BED_TEMP = params.BED_TEMP|default(45)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set EXTRUDER_WAITTEMP = (EXTRUDER_TEMP/1.5|float)|int %}
  {% set multicolor_method = printer.virtual_sdcard.multicolor_method|int %}
  {% set file_name = printer.virtual_sdcard.file_name %}
  # {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %} #fuildd网页打印
    M106 S0  #需要关闭模型风扇
    SUB_FAN SWITCH=1
    M104 S140
    M140 S{params.BED_TEMP}
    CANCEL_HOMEZ_NACCU  # 复位精归零标志
    G28
    PRINT_PREPARE_LOAD_MATERIAL FILENAME='{file_name}'
    NOZ_CLEAR # 精擦嘴
    NEXT_HOMEZ_NACCU # 精归零标志, 下次G28 Z时会精归零
    G28 Z # 精归零
  {% else %} #其他打印
    PRINT_PREPARE_CLEAR
  {% endif %}
  BOX_GO_TO_EXTRUDE_POS#M1500
  M140 S{params.BED_TEMP}
