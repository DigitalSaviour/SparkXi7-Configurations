variable_shaper_calibrate: 1800000  # 秒 500小时
variable_belt_tensioning: 3600000  # 秒 1000小时
variable_motion_mechanism_lubrication: 1800000  # 秒
variable_camera_maintenance: 1800000  # 秒
variable_fan_inspection: 1800000  # 秒
variable_nozzle: 20000  # 克
variable_cut: 100000  # 次
variable_machine_teflon_tube: 3600000  # 秒
variable_wipe_mouth_strip: 1800000  # 秒
variable_air_filter: 1800000  # 秒
variable_cfs_teflon_tube: 3600000  # 秒
variable_cfs_desiccant: 1800000  # 秒
gcode:

[gcode_macro MAINTENANCE_ITEM]
gcode:

[gcode_macro PRINTER_PARAM]
variable_z_safe_pause: 0.0
variable_max_x_position: 260.0
variable_max_y_position: 260.0
variable_max_z_position: 255.0
variable_extrude_position: 267.0
variable_end_print_y_position: 199.0
variable_saved_end_print_z: 0.0
variable_fans: 3
variable_auto_g29: 0
variable_default_bed_temp: 50
variable_default_extruder_temp: 240
variable_g28_extruder_temp: 140
variable_print_calibration: 0
variable_fan0_min: 51
variable_fan0_speed: 0
variable_hotend_temp: 200
variable_default_acc: 11000
variable_power_loss_z_offset: -0.2 #断电续打Z轴偏移值
gcode:

[gcode_macro STRUCTURE_PARAM]
variable_bed_length: 260
variable_bed_width: 260
variable_bed_hight: 300
variable_laser_x_offset: 45.0
variable_laser_y_offset: -8.0
variable_laser_z_offset: 3.0
variable_cali_x_offset: 200.9
variable_cali_y_offset: 8.9
variable_cali_z_offset: 5.0
gcode:

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_inside_cancel: 0
gcode:
  ENABLE_PRESSURE_ADVANCE VALUE=1
  {action_respond_info("CANCEL_PRINT trigger ENABLE_PRESSURE_ADVANCE=1")}
  {action_respond_info("start CANCEL_PRINT")}
  SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=inside_cancel VALUE=1
  {% set inside_cancel = printer['gcode_macro CANCEL_PRINT'].inside_cancel|int %}
  CANCEL_PRINT_BASE
  END_PRINT
  {action_respond_info("end END_PRINT success")}
  SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=inside_cancel VALUE=0
  SDCARD_RESET_FILE_SIZE
  {action_respond_info("CANCEL_PRINT success")}

[gcode_macro MOTOR_CANCEL_PRINT]
gcode:
  EXCLUDE_OBJECT_RESET
  PRINT_PREPARE_CLEAR
  M220 S100
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000
  TURN_OFF_HEATERS
  M107 P1
  M107 P2
  M141 S0
  SET_PIN PIN=extruder_fan VALUE=0
  BOX_SET_CURRENT_BOX_IDLE_MODE
  CANCEL_PRINT_BASE
  WAIT_TEMP_START

[gcode_macro EXTRUDER_EXTRUDE]
gcode:
  {% if printer['smart_filament_rack'].enable|int == 1 and printer['smart_filament_rack'].state|lower == 'connect'%}
    SMART_FILAMENT_RACK_EXTRUDER_EXTRUDE LENGTH={params.LENGTH}
  {% else %}
    BOX_EXTRUDER_EXTRUDE LENGTH={params.LENGTH}
  {% endif %}

#打印前准备进料冲刷
[gcode_macro PRINT_PREPARE_LOAD_MATERIAL]
gcode:
  BOX_ERROR_CLEAR
  BOX_CUT_CHECH_STATE
  # 切刀回弹时进料
  {% if printer['box'].cut_state|int == 0 %}
    {% if printer['box'].enable|int == 1 and printer['box'].state|lower == 'connect' %}
      {% if params.FILENAME is defined and params.FILENAME != '' %}
        RESPONSE_INFO MSG="FILENAME={params.FILENAME}"
        BOX_START_PRINT_EXTRUDE_MATERIAL FILENAME='{params.FILENAME}'
      {% endif %}
    {% elif printer['smart_filament_rack'].enable|int == 1 and printer['smart_filament_rack'].state|lower == 'connect' %}
      SMART_RACK_LOAD_MATERIAL
      SMART_FILAMENT_SET_PRINT_MODE
    {% else %}
      LOAD_MATERIAL
    {% endif %}
    BOX_GO_TO_EXTRUDE_POS
  {% endif %}

[gcode_macro PRINT_PREPARE_QUIT_MATERIAL]
gcode:
  {% if printer.extruder.can_extrude|lower == 'false' %} 
    BOX_MOVE_TO_SAFE_POS
    M109 S200   #切料动作有e轴动作
  {% endif %}
  M400
  BOX_ERROR_CLEAR
  BOX_CUT_CHECH_STATE
  BOX_MOVE_TO_CUT
  M400
  {% if printer['box'].enable|int == 1 and printer['box'].state|lower == 'connect' %}
    BOX_RETRUDE_MATERIAL
    RESPONSE_INFO MSG="box  PRINT_PREPARE_CUT_POS_CHECK"      
  {% elif printer['smart_filament_rack'].enable|int == 1 and printer['smart_filament_rack'].state|lower == 'connect' %}
    SMART_FILAMENT_RACK_RETRUDE_MATERIAL
    RESPONSE_INFO MSG="smart_filament_rack  PRINT_PREPARE_CUT_POS_CHECK"
  {% else %}
    #结构设计切刀平面到齿轮咬合处15.9mm  确定回退10mm,避免脱齿
    QUIT_MATERIAL_RETRUDE_MATERIAL LENTH=10
    RESPONSE_INFO MSG="PRINT_PREPARE_CUT_POS_CHECK"     
  {% endif %}

