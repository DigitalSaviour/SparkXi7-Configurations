gcode:
  {% set printer_state = printer.print_stats.state %}
  {% set force = params.FORCE|default(0)|int %}
  {% if printer['gcode_macro Qmode'].flag|int == 0 %}
     {% if printer_state == "printing" or force == 1 %}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=accel VALUE={printer.toolhead.max_accel}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=accel_to_decel VALUE={printer.toolhead.max_accel_to_decel}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=velocity VALUE={printer.toolhead.max_velocity}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=square_corner_velocity VALUE={printer.toolhead.square_corner_velocity}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=pressure_advance VALUE={printer.extruder.pressure_advance}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=speed_factor VALUE={printer.gcode_move.speed_factor}

      # Set Motion Parameter
      M220 S50
      {% set tmp = printer['output_pin fan0'].value * 255 %}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE={tmp}

      {% set layer_count = printer['virtual_sdcard'].layer|int %}
      { action_respond_info("Qmode layer_count=%s" % layer_count) }
      {% if layer_count > 1 %}  # 首层不限制风扇速度，非首层限制风扇速度
        {% set tmp = tmp * printer['gcode_macro Qmode'].fan_ratio %}
        {% if tmp  < 255 * printer['gcode_macro Qmode'].fan_ratio %}
            {% set tmp = 255 * printer['gcode_macro Qmode'].fan_ratio %}   #设置最低转速
        {% endif %}
            SET_PIN PIN=fan0 VALUE={tmp}
      {% endif %}

      {% set tmp = printer['output_pin board_fan'].value * 1 %}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=board_fan_value VALUE={tmp}

      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=flag VALUE=1
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=pending VALUE=0
      #SET_QMODE_FLAG FLAG=1
     {% else %}
      # 在非打印阶段下，记录状态但不执行
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=pending VALUE=1
      {action_respond_info("Qmode will be enabled when printing starts")}
     {% endif %}
  {% endif %}

[gcode_macro Qmode_exit]
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Qmode'].flag|int == 1 %}
    {% if printer_state == "printing" or printer_state == "paused" %}
      # SET_VELOCITY_LIMIT ACCEL={printer['gcode_macro Qmode'].accel}
      # SET_VELOCITY_LIMIT ACCEL_TO_DECEL={printer['gcode_macro Qmode'].accel_to_decel}
      # SET_VELOCITY_LIMIT VELOCITY={printer['gcode_macro Qmode'].velocity}
      # SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer['gcode_macro Qmode'].square_corner_velocity}
      # SET_PRESSURE_ADVANCE ADVANCE={printer['gcode_macro Qmode'].pressure_advance}
      M220 S{printer['gcode_macro Qmode'].speed_factor * 100}

      {% if printer['output_pin fan0'].value != 0 %}
        {action_respond_info("fan0_value = %s" % printer['gcode_macro Qmode'].fan0_value)}
        SET_PIN PIN=fan0 VALUE={printer['gcode_macro Qmode'].fan0_value}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE=0
      {% endif %}
    {% endif %}
    #SET_QMODE_FLAG FLAG=0
  {% endif %}
  # 无论什么状态下都清除标志
  SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=flag VALUE=0
  SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=pending VALUE=0


[gcode_macro LED_SWITCH]
gcode:
  #控制灯光开关 盒子和续料模块
  {% set led_flag = params.SWITCH|default(1)|int %}
  {% if led_flag == 1 %}
    {% if printer['box'].state|lower == 'connect' %}
      BOX_TURN_OFF_LED ONOFF=1
    {% elif printer['smart_filament_rack'].state|lower == 'connect' %}
      SMART_FILAMENT_RACK_TURN_OFF_LED ONOFF=1
    {% endif %}
    {action_respond_info("LED_SWITCH STATE ON")}
  {% else %}
    {% if printer['box'].state|lower == 'connect' %}
      BOX_TURN_OFF_LED ONOFF=0
    {% elif printer['smart_filament_rack'].state|lower == 'connect' %}
      SMART_FILAMENT_RACK_TURN_OFF_LED ONOFF=0
    {% endif %}
    {action_respond_info("LED_SWITCH STATE OFF")}
  {% endif %}



[gcode_macro Smode]   #安睡模式
variable_last_is_qmode: 0
gcode:
  {action_respond_info("Smode xxxxxxxxxxxxxxxxxxxxxxxxxx")}
  Qmode
  #禁用所有的灯效
  LED_SWITCH SWITCH=0



[gcode_macro Smode_exit]
gcode:
  {action_respond_info("Smode_exit xxxxxxxxxxxxxxxxxxxxxxxxxx")}
  Qmode_exit
  #具体灯效恢复
  LED_SWITCH SWITCH=1




[gcode_macro Rmode]
variable_flag: 0
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Rmode'].flag|int == 0 %}
  {% if printer_state == "printing" or printer_state == "paused" %}
  SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=flag VALUE=1
  SET_RMODE_FLAG FLAG=1
  SET_VELOCITY_LIMIT VELOCITY=500
  M220 S166
  SET_PIN PIN=fan0 VALUE=200
  {% endif %}
  {% endif %}

[gcode_macro Rmode_exit]
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Rmode'].flag|int == 1 %}
  {% if printer_state == "printing" or printer_state == "paused" %}
  SET_GCODE_VARIABLE MACRO=Rmode VARIABLE=flag VALUE=0
  SET_RMODE_FLAG FLAG=0
  SET_VELOCITY_LIMIT VELOCITY=300
  M220 S100
  SET_PIN PIN=fan0 VALUE=127
  {% endif %}
  {% endif %}


[gcode_macro A_TriPress_STEP1]
gcode:
  G28
  G1 Z25 F600

[gcode_macro A_TriPress_STEP2]
gcode:
  PROBE_ACCURACY PROBE_SPEED=5

;[delayed_gcode STARTUP_READ_FILAMENT_RACK_RFID] #开机读RFID，防止开机过程中扫描RFID后，RFID失效问题
;initial_duration: 2
;gcode:
;  {action_respond_info("STARTUP_READ_FILAMENT_RACK_RFID")}
;  FILAMENT_RACK



[gcode_macro SMART_RACK_ER]
variable_is_error:0
variable_success_count:0
variable_need_cut:1
gcode:
  {% set error_code = printer.smart_filament_rack.error_code %}
    {% if error_code == 0 %}
    RESPONSE_INFO MSG="Preparing for the {params.T}th run. "
    SMART_FILAMENT_RACK_ERROR_CLEAR
    SMART_RACK_QUIT_MATERIAL
    SMART_RACK_LOAD_MATERIAL
    SET_GCODE_VARIABLE MACRO=SMART_RACK_ER VARIABLE=success_count VALUE={params.T}
    RESPONSE_INFO MSG="Finish {params.T}th"
  {% else %}
    RESPONSE_INFO MSG="Error occurred:{error_code},success_count:{ printer['gcode_macro SMART_RACK_ER'].success_count }"
  {% endif %}


[gcode_macro SMART_RACK_ER_LOOP]
gcode:
  SET_GCODE_VARIABLE MACRO=SMART_RACK_ER VARIABLE=need_cut VALUE={params.C|default(1)|int}
  {% for i in range(params.T | int) %}
    SMART_RACK_ER T={i}
    G4 P60000
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=SMART_RACK_ER VARIABLE=need_cut VALUE=1

[gcode_macro SUB_FAN]
gcode:
  #控制底板风扇和e电机散热风扇
  {% set fan_flag = params.SWITCH|default(0)|int %}
  {% if fan_flag == 1 %}
    SET_PIN PIN=board_fan VALUE=1
    SET_PIN PIN=e_fan VALUE=1
    {action_respond_info("E&BOARD_FAN STATE ON")}
  {% else %}
    SET_PIN PIN=board_fan VALUE=0
    {action_respond_info("E&BOARD_FAN STATE OFF")}
  {% endif %}


#产测噪音测试 速度和加速采用首层参数
[gcode_macro FACTORY_NOISE_TEST]
variable_accel_to_decel:250
variable_acc:500
variable_spped:4800
gcode:
    {action_respond_info("NOISE_TEST START")}
    {% set x_max = printer['gcode_macro PRINTER_PARAM'].max_x_position|float %}
    {% set y_max = printer['gcode_macro PRINTER_PARAM'].max_y_position|float %}
    {% set x_min = 0 %}
    {% set y_min = 0 %}
    {% set x_center = x_max / 2 %}
    {% set y_center = y_max / 2 %}

    {% set acc = printer['gcode_macro FACTORY_NOISE_TEST'].acc|int %}
    {% set acc_to_dec = printer['gcode_macro FACTORY_NOISE_TEST'].accel_to_decel|int %}
    {% set speed = printer['gcode_macro FACTORY_NOISE_TEST'].spped|int %}
    {action_respond_info("x_max=%d y_max=%d acc=%d acc_to_dec=%d speed=%d" % (x_max,y_max,acc,acc_to_dec,speed))}
    G28
    G90
    SET_VELOCITY_LIMIT ACCEL={acc} ACCEL_TO_DECEL={acc_to_dec}
    G1 F{speed}
    G1 X{x_max} Y{y_max} Z10
    G1 X{x_min} Y{y_max}
    G1 X{x_max} Y{y_min}
    G1 X{x_min} Y{y_min}
    G1 X{x_center} Y{y_center}
    M84

# LED effect test
[gcode_macro LED_EFFECT_TEST]
gcode:
    {% set effect = params.EFFECT|default(1)|int %}
    {% set color = params.COLOR|default(1)|int %}
    {% set tnn = params.TNN|default('T1A') %}
    {action_respond_info("--- tnn = %s effect = %d, color = %d" % (tnn, effect, color))}
    BOX_SET_BOX_LED_EFFECT TNN={tnn} LED_EFFECT={effect} LED_COLOR={color}
