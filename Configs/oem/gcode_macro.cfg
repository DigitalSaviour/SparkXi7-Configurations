[gcode_macro M106]
gcode:
  {% set fans = printer["gcode_macro PRINTER_PARAM"].fans|int %}
  {% set fan = 0 %}
  {% set value = 0 %}
  {% if params.P is defined %}
      {% set tmp = params.P|int %}
      {% if tmp < fans %}
        {% set fan = tmp %}
      {% endif %}
  {% endif %}

  {% if params.S is defined %}
    {% set tmp = params.S|float %}
  {% else %}
    {% set tmp = 255 %}
  {% endif %}

  {% if tmp > 0 %}
    {% if fan == 0 %}
      {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan0_min) / 255 * tmp %}
      {% if printer['gcode_macro Rmode'].flag | int == 0 %}
        #{% if tmp > printer['gcode_macro PRINTER_PARAM'].fan0_min * 2  %}  #51
        {% if tmp > printer['gcode_macro PRINTER_PARAM'].fan0_min %}
          {% set value = tmp %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min %}
        {% endif %}
      {% else %}
        {% if tmp < printer['gcode_macro PRINTER_PARAM'].fan0_min %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min %}
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}
###########################  fan 1 2 #######################
  {% if fan in [1, 2, 3] %}
    RESPONSE_INFO MSG="fan{fan} is not support"
  {% else %}
    {% if value >= 255 %}
      {% set value = 255 %}
    {% endif %}
    {% if printer['gcode_macro Qmode'].flag|int == 1 and printer.print_stats.state == "printing" and printer['box'].inside_cr_box == False %}
      {% set layer_count = printer['virtual_sdcard'].layer|int %}
      { action_respond_info("Qmode M106 layer_count=%s" % layer_count) }
      {% if layer_count > 1 %}  # 首层不限制风扇速度，非首层限制风扇速度
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE={value}
        {% set value = value * printer['gcode_macro Qmode'].fan_ratio %}
        {% if value  < 255 * printer['gcode_macro Qmode'].fan_ratio %}
            {% set value = 255 * printer['gcode_macro Qmode'].fan_ratio %}   #设置最低转速
        {% endif %}
        SET_PIN PIN=fan{fan} VALUE={value}
      {% endif %}
    {% else %}
      {% if printer['box'].inside_cr_box == True %}
        {action_respond_info("Flush inside_cr_box: True")}  #静音模式冲刷阶段 禁用限制
      {% endif %}
    SET_PIN PIN=fan{fan} VALUE={value}
  {% endif %}
  {% endif %}
##########################  NOT fan 1 2 ####################

[gcode_macro M107]
gcode:
  {% set fans = printer["gcode_macro PRINTER_PARAM"].fans|int %}
  {% if params.P is defined %}
    {% if params.P|int < fans %}
      SET_PIN PIN=fan{params.P|int} VALUE=0
    {% else %}
      SET_PIN PIN=fan0 VALUE=0
    {% endif %}
  {% else %}
    SET_PIN PIN=fan0 VALUE=0
    SUB_FAN SWITCH=0
  {% endif %}


