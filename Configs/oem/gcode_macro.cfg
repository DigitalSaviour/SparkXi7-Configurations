    EXTRUDER_EXTRUDE LENGTH=50
    M400
    BOX_NOZZLE_CLEAN
  {% else %}
    {action_respond_info("multicolor_method\n")}
  {% endif %}
  # M140 S{params.BED_TEMP}
  # NOZCLEAR_START_PRINT
  # M220 S100 ;Reset Feedrate
  # M221 S100 ;Reset Flowrate
  APPLY_PENDING_SETTINGS
  G21
  G92 E0 ; Reset Extruder

